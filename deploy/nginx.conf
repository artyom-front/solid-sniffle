# SCORESBOX · справочная копия nginx-конфига.
# Рабочий конфиг на сервере генерирует: sudo ./scripts/setup-nginx.sh <домен>
# (сейчас: ./scripts/setup-nginx.sh footballday.ru — временный домен;
#  после получения доступа к scoresbox.ru: ./scripts/setup-nginx.sh scoresbox.ru)
# Куда кладётся: /etc/nginx/sites-available/scoresbox
upstream scoresbox_app {
    server 127.0.0.1:3000;
    keepalive 32;          # задел под WebSocket (live-счёт) и 2-й инстанс
}

server {
    listen 80;
    server_name footballday.ru www.footballday.ru;

    # SSL добавит: certbot --nginx -d footballday.ru -d www.footballday.ru
    # (certbot сам перепишет этот блок на редирект 301 -> https)

    # безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для текстовых ассетов (HTML/JSON/JS/CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location / {
        proxy_pass http://scoresbox_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # статика Next.js иммутабельна — кэшируем на 30 дней
    location /_next/static/ {
        proxy_pass http://scoresbox_app;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
