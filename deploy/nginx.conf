# SCORESBOX · справочная копия nginx-конфига.
# Рабочий конфиг на сервере генерирует: sudo ./scripts/setup-nginx.sh <домен>
# (актуальный домен: ./scripts/setup-nginx.sh scoresbox.ru)
# Куда кладётся: /etc/nginx/sites-available/scoresbox
upstream scoresbox_app {
    server 127.0.0.1:3000;
    keepalive 32;          # задел под WebSocket (live-счёт) и 2-й инстанс
}

server {
    listen 80;
    server_name scoresbox.ru www.scoresbox.ru;

    # SSL добавит: certbot --nginx -d scoresbox.ru -d www.scoresbox.ru
    # (certbot сам перепишет этот блок на редирект 301 -> https)

    # безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для текстовых ассетов (HTML/JSON/JS/CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SECURITY/UPLOAD: backend принимает изображения до 6 МБ и PDF до 10 МБ
    # (src/app/api/admin/media). 2m обрезал загрузку на уровне nginx (413)
    # раньше, чем файл доходил до Next.js. 12m = лимит + запас на multipart-обёртку.
    client_max_body_size 12m;

    location / {
        proxy_pass http://scoresbox_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # статика Next.js иммутабельна — кэшируем на 30 дней
    location /_next/static/ {
        proxy_pass http://scoresbox_app;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
